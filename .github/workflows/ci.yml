name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: ${{ matrix.app }} · lint + test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [api, ml]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: satushy
          POSTGRES_PASSWORD: satushy
          POSTGRES_DB: satushy
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U satushy" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_OWNER_URL: postgresql+asyncpg://satushy:satushy@localhost:5432/satushy_test
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
          cache-dependency-glob: apps/${{ matrix.app }}/uv.lock
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest

  web:
    name: web · lint + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
