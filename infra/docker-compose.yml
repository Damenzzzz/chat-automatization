name: satushy

x-env: &app-env
  env_file:
    - path: ../.env.example
    - path: ../.env
      required: false

x-python-env: &python-env
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_APP_USER:-satushy_app}:${POSTGRES_APP_PASSWORD:-satushy_app}@postgres:5432/${POSTGRES_DB:-satushy}
  DATABASE_OWNER_URL: postgresql+asyncpg://${POSTGRES_USER:-satushy}:${POSTGRES_PASSWORD:-satushy}@postgres:5432/${POSTGRES_DB:-satushy}
  REDIS_URL: redis://redis:6379/0
  S3_ENDPOINT_URL: http://minio:9000
  ML_URL: http://ml:8001

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-satushy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-satushy}
      POSTGRES_DB: ${POSTGRES_DB:-satushy}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:-satushy_app}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:-satushy_app}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: cgr.dev/chainguard/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-satushy}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-satushy-dev-secret}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio-init:
    image: cgr.dev/chainguard/minio:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["bash", "-c"]
    command:
      - >-
        mc alias set s3 http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" &&
        mc mb --ignore-existing "s3/$$S3_BUCKET"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-satushy}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-satushy-dev-secret}
      S3_BUCKET: ${S3_BUCKET:-satushy}
    restart: "no"

  api:
    build: ../apps/api
    <<: *app-env
    environment: *python-env
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--timeout-graceful-shutdown", "5"]
    ports:
      - "${API_PORT:-8100}:8000"
    volumes:
      - ../apps/api:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 20

  worker:
    build: ../apps/api
    <<: *app-env
    environment: *python-env
    command: ["arq", "app.worker.WorkerSettings", "--watch", "app"]
    volumes:
      - ../apps/api:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  ml:
    build: ../apps/ml
    <<: *app-env
    environment:
      ML_EMBEDDER: ${ML_EMBEDDER:-bge-m3}
      ML_RERANKER: ${ML_RERANKER:-bge-m3}
    restart: unless-stopped
    ports:
      - "${ML_PORT:-8001}:8001"
    volumes:
      - ../apps/ml:/app
      - ml-models:/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

  web:
    build:
      context: ../apps/web
      target: dev
    environment:
      API_INTERNAL_URL: http://api:8000
    ports:
      - "${WEB_PORT:-3000}:3000"
    volumes:
      - ../apps/web:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
  minio-data:
  ml-models:
